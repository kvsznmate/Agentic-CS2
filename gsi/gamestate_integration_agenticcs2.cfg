"Agentic-CS2 GSI feasibility v1"
{
  // Step-1 feasibility config (PROJECT_ISSUES: detection/alive-filter track).
  //
  // PURPOSE: prove that CS2 emits the LOCAL PLAYER'S alive/dead state via Game
  // State Integration, on this machine, before we build recorder/schema on it.
  // This subscribes ONLY to the minimal blocks needed to answer that, plus
  // player_weapons for combat context:
  //   player_state   -> health/armor (health>0 == alive) for OUR player
  //   player_id      -> our steamid/name + team (to confirm it's really us)
  //   player_weapons -> active weapon + clip/reserve ammo (combat context)
  //   round / map    -> round & match phase (freezetime/live/over; warmup/live)
  //                     so we can see non-gameplay phases we may also filter.
  //
  // We deliberately do NOT request allplayers_* / *_position / phase_countdowns:
  // those are OBSERVER/GOTV-only (see Valve GSI docs) and irrelevant to the
  // "am I alive in my own POV" question. Keep the payload small and focused.
  //
  // INSTALL: copy this file into the CS2 cfg directory, then restart CS2.
  //   Typical path (verify on your machine):
  //   <Steam>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
  //   (CS2 still uses the legacy 'csgo' folder name under the hood.)
  //   Find <Steam> via registry HKCU\Software\Valve\Steam : SteamPath.
  //   The file MUST be saved WITHOUT a UTF-8 BOM or CS2 silently ignores it.
  //
  // The listener (src/gsi_probe.py) must be running BEFORE you launch CS2, on
  // the same uri/port below.

  "uri"       "http://127.0.0.1:3000"
  "timeout"   "5.0"
  "buffer"    "0.0"    // localhost: no buffering, report state changes immediately
  "throttle"  "0.1"    // but no more often than every 0.1s, to bound traffic
  "heartbeat" "10.0"   // send at least every 10s even if nothing changes

  "auth"
  {
    "token" "agentic_cs2_local"
  }

  "output"
  {
    "precision_time" "2"
  }

  "data"
  {
    "provider"       "1"   // game/appid/our steamid — confirms who is reporting
    "map"            "1"   // map, gamemode, match phase (warmup/live/gameover)
    "round"          "1"   // round phase (freezetime/live/over)
    "player_id"      "1"   // our name, steamid, team
    "player_state"   "1"   // health, armor, flashed, ... (health>0 == alive)
    "player_weapons" "1"   // carried weapons, active one, clip/reserve ammo
  }
}
